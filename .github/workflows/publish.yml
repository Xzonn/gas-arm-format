name: Publish to PyPI

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install GNU ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi
      - name: Install package and test dependencies
        run: python -m pip install '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gas-arm-format/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
